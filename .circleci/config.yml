version: 2.1
jobs:
  build:
    machine: true
    resource_class: logan/windows-runner-test-arm64
    steps:
      - run: (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" -Name PROCESSOR_ARCHITECTURE).PROCESSOR_ARCHITECTURE
      - run: $env:PROCESSOR_ARCHITECTURE
      - run: (Get-CimInstance Win32_OperatingSystem).OSArchitecture
      - run: echo "This is on Windows ARM!"
workflows:
  build-workflow:
    jobs:
      - build
